[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
sensor_sim = { path = "../sensor_sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
